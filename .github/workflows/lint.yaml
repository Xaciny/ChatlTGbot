name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  
      checks: write      

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          pip install ruff==0.9.6

      - name: Check formatting
        run: ruff format . --check

      - name: Run Ruff linter (with GitHub annotations)
        id: ruff
        continue-on-error: true 
        run: ruff check . --output-format=github

      - name: Post comment with summary
        if: always() && steps.ruff.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## Ruff Linter Results
            
            ❌ **Formatting or linting issues found**
            
            Please check the **annotations** in the "Files changed" tab or run locally:
            \`\`\`bash
            ruff check . --fix
            ruff format .
            \`\`\`
            
            See [Ruff documentation](https://docs.astral.sh/ruff/) for details.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail workflow if linting failed
        if: steps.ruff.outcome != 'success'
        run: exit 1
